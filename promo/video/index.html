<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0B0F19;
      }
      #root {
        width: 100%;
        height: 100%;
        font-family: "Inter", sans-serif;
      }
      #ground {
        position: absolute;
        inset: 0;
        background: #0B0F19;
      }
    </style>
  </head>
  <body>
    <!-- ClearScan promo: 9 scenes, 28 s, cuts on a 120 BPM grid (0.5 s). Voiceover + SFX; music can go on its own <audio> later. -->

      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="28"
      data-width="1080"
      data-height="1920"
    >
      <div id="ground"></div>
      <div
        id="desk"
        data-composition-id="desk"
        data-composition-src="compositions/desk.html"
        data-start="0"
        data-duration="2.5"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="capture"
        data-composition-id="capture"
        data-composition-src="compositions/capture.html"
        data-start="2.5"

        data-width="1080"
        data-height="1920"
      ></div>
