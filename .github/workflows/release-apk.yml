name: Release APK

# Push a tag like v1.2.0 (or run manually) to build the Android APKs and attach them to a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create or update (e.g. v1.2.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build APKs
        run: |
          mkdir -p dist
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk dist/ClearScan-universal.apk
          flutter build apk --release --split-per-abi

      - name: Collect per-ABI APKs
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/ClearScan-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/ClearScan-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk dist/ClearScan-x86_64.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ClearScan ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/*.apk
